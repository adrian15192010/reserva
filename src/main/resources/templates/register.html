<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    form {
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 300px;
    }
    h2 {
        text-align: center;
        color: #333;
    }
    label {
        display: block;
        margin-bottom: 8px;
        color: #555;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
        width: 93%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    button {
        width: 100%;
        padding: 10px;
        background-color: #28a745;
        border: none;
        border-radius: 4px;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
    }
    button:hover {
        background-color: #218838;
    }

    img{
        position: absolute;
        height: 5rem;
        width: 5rem;
        top: .3rem;
        left: 40.5rem;
        visibility: hidden;
    }

    img.hidden{
        visibility: visible;
    }

</style>
<body>
    <img src="ZKZg" alt="">
    <form action=  method="POST">
        <h2>Registro de Usuario</h2>
        <label for="firstName">Nombre:</label>
        <input type="text" id="firstName" name="firstName" required>

        <label for="username">Correo Electrónico:</label>
        <input type="email" id="username" name="username" required>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required>


        <button type="submit">Registrar</button>
    </form>
</body>
<script>

const d = document;
let ruta;

d.addEventListener("DOMContentLoaded",e=>{

     ruta = window.location.origin

    d.addEventListener("click", e =>{
    e.preventDefault();
if(e.target.matches("button")){
    e.preventDefault();
    d.querySelector("img").classList.toggle("hidden");

    let $inputs = d.querySelectorAll("input");
    console.log($inputs[0].value);

fetch(`${ruta}/api/auth/register/${ruta}`,{
    method:"POST",
    headers: {
    'Content-Type': 'application/json' 
    },
    body: JSON.stringify({  
    name: $inputs[0].value,      
    email: $inputs[1].value,
	password:$inputs[2].value
    })
  })
  .then(res=> res.ok ? res.text() : Promise.reject(res))
  .then(json=>{
    d.querySelector("img").classList.toggle("hidden");
  alert(json);  
  console.log(json);
  
  })
  .catch(error=>{
    d.querySelector("img").classList.toggle("hidden");
        alert("error, el usuario ya existe");
    error.status == 409 ? alert("error: usuario existente") : alert("otro error")
 });
  
}


    })

});


</script>
</html>
